# Schema managed by Liquibase, Hibernate validates it matches.
spring.jpa.hibernate.ddl-auto=validate

# PostgreSQL local database.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/db_parcel_organizer}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:root}

# JWT Security values and logging level.
security.jwt.signing.key=our-super-secret-signing-key
logging.level.org.springframework.security=debug

# Liquibase
spring.liquibase.enabled=true