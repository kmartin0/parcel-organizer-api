# Liquibase configuration — local/default values.
#
# Values below are used only when the matching environment variable is not set:
#
#   LIQUIBASE_COMMAND_URL       overrides url
#   LIQUIBASE_COMMAND_USERNAME  overrides username
#   LIQUIBASE_COMMAND_PASSWORD  overrides password
#   LIQUIBASE_DRIVER            overrides driver
#
# -----------------------------------------------------------------------------
# Usage
# -----------------------------------------------------------------------------
#
# Dev (default — uses the values below, no setup needed):
#
#   mvn liquibase:update
#
# Test (in-memory H2 — verifies changesets applied):
#
#   export LIQUIBASE_DRIVER=org.h2.Driver
#   export LIQUIBASE_COMMAND_URL="jdbc:h2:mem:db;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;MODE=PostgreSQL;"
#   export LIQUIBASE_COMMAND_USERNAME=root
#   export LIQUIBASE_COMMAND_PASSWORD=root
#   mvn liquibase:update
#
# Prod (production db credentials):
#
#   export LIQUIBASE_COMMAND_URL=jdbc:postgresql://<prod-host>:5432/<prod-db>
#   export LIQUIBASE_COMMAND_USERNAME=<prod-username>
#   export LIQUIBASE_COMMAND_PASSWORD=<prod-password>
#   mvn liquibase:update
# -----------------------------------------------------------------------------
url=jdbc:postgresql://localhost:5432/db_parcel_organizer
username=postgres
password=root
driver=org.postgresql.Driver
changeLogFile=liquibase/changelog/db-changelog-master.xml